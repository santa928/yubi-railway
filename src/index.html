<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1767dc" />
    <title>ゆびで せんろ</title>
    <meta
      name="description"
      content="指で線路を描くと電車とまちが生まれる、上に流れる小さな世界。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231767dc'/%3E%3Cpath d='M9 5v22M23 5v22M9 9h14M9 16h14M9 23h14' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header>
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">〰</span>
          <h1>ゆびで <strong>せんろ</strong></h1>
        </div>
        <button
          id="clear"
          class="clear"
          type="button"
          aria-label="線路を全部消して、もう一度描く"
        >
          <span aria-hidden="true">↻</span> かきなおす
        </button>
      </header>
      <section class="play" aria-label="線路を描く遊び場">
        <canvas
          id="canvas"
          tabindex="0"
          aria-label="複数の指やマウスでなぞると、それぞれの線路が描けます。長く線路を描くと、電車が少し後ろから走り始めます。完成した線路では折り返します。画面は上に流れます。キーボードではEnterで見本の線路、Deleteで消去。"
        ></canvas>
        <div id="error" class="error" role="alert" hidden>
          <h2>3Dを表示できませんでした</h2>
          <p></p>
          <button id="reload" type="button">もういちど読み込む</button>
        </div>
        <div id="hint" class="hint" aria-hidden="true">
          <h2>せんろを のばして<br />でんしゃを よぼう</h2>
          <p>ながく なぞると、あとから はしってくるよ</p>
        </div>
        <div class="sound-controls">
          <button
            id="sound"
            type="button"
            aria-label="音を消す"
            aria-pressed="false"
          >
            音あり</button
          ><label
            >音量<input
              id="volume"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="0.35"
              aria-label="音量"
          /></label>
          <details class="music-credit">
            <summary aria-label="音楽クレジット">♪</summary>
            <div>
              <strong>音楽クレジット</strong>
              <p>
                I've Been Working on the Railroad<br />Traditional / audio
                provided by
                <a
                  href="https://www.8notes.com/scores/6974.asp"
                  target="_blank"
                  rel="noopener noreferrer"
                  >8notes.com</a
                >
                / Digital Tradition collection
              </p>
              <p>
                <a
                  href="https://creativecommons.org/licenses/by/3.0/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >CC BY 3.0</a
                >。音源ファイルは未編集。ゲーム内で音量調整・ループ再生。
              </p>
            </div>
          </details>
        </div>
        <button
          id="pause"
          class="pause"
          type="button"
          aria-label="電車を止める"
          hidden
        >
          Ⅱ
        </button>
      </section>
      <footer>
        <span class="instruction" id="status" role="status"
          >ゆびで なぞってね</span
        ><span class="footer-note">せんろと まちが、どこまでも</span>
      </footer>
    </main>
  </body>
</html>
